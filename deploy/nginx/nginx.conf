# ==============================================================================
# StenoVision - Production Nginx Reverse Proxy Configuration
# Milestone 4: Unified Gateway, Compression & Security Routing
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'rid="$http_x_request_id"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip Compression for Next.js assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Maximum file upload size for high-resolution angiograms and DICOM/CCTA files
    client_max_body_size 50M;

    # Upstream Microservices
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_ui {
        server frontend:3000;
        keepalive 32;
    }

    # HTTP Server (Port 80 — IPv4 & IPv6 + ACME Challenge)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/proxy_routes.conf;
    }

    # HTTPS Server for Trusted sslip.io Domain (Let's Encrypt TLS)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name 56-228-24-218.sslip.io;

        ssl_certificate /etc/nginx/ssl/sslip.crt;
        ssl_certificate_key /etc/nginx/ssl/sslip.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/proxy_routes.conf;
    }

    # HTTPS Fallback Server for Direct IPv4/IPv6 Access (SAN Certificate)
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/proxy_routes.conf;
    }
}
